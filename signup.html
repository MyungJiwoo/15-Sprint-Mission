<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/account/account.css" />
    <title>판다마켓 - 회원가입</title>
  </head>

  <body>
    <div class="loginContainer">
      <header>
        <a href="/">
          <img
            src="images/img_logo.png"
            alt="판다마켓 로고"
            class="image-logo"
          />
        </a>
      </header>

      <form>
        <label>이메일 <input type="email" /></label>
        <label>닉네임 <input type="text" /></label>
        <label>비밀번호 <input type="password" /></label>
        <label>비밀번호 확인 <input type="password" /></label>
        <button type="submit">회원가입</button>
      </form>

      <div class="SociaLoginContainer">
        <p>간편 로그인하기</p>
        <ul>
          <li>
            <a href="https://www.google.com/">
              <img src="./images/icon_google_login.png" alt="구글 로그인"
            /></a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com/page/">
              <img src="./images/icon_kakao_login.png" alt="카카오 로그인"
            /></a>
          </li>
        </ul>
      </div>

      <p class="signupBtn">
        이미 회원이신가요? <a href="/login.html">로그인</a>
      </p>
    </div>
  </body>
</html>
