<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/index/index.css" />
    <title>판다마켓</title>
    <link rel="icon" href="/images/icon_favicon.ico" />
  </head>

  <body>
    <header>
      <a href="/">
        <img src="images/img_logo.png" alt="판다마켓 로고" class="image-logo" />
      </a>
      <a href="login.html">
        <div class="btn-login">로그인</div>
      </a>
    </header>

    <div class="home-top-banner">
      <div>
        <div class="banner-content">
          <p class="banner-title">
            일상의 모든 물건을<br />
            거래해 보세요
          </p>
          <a href="items.html">
            <div class="btn-explore">구경하러 가기</div>
          </a>
        </div>
        <img
          src="images/img_home_banner_top.png"
          alt="판다마켓 캐릭터"
          class="image-top-banner"
        />
      </div>
    </div>

    <section>
      <div class="section-hot-item">
        <img src="images/img_home_01.png" alt="인기 상품" />
        <div>
          <p class="section-badge">Hot item</p>
          <p class="section-title">
            인기 상품을<br />
            확인해 보세요
          </p>
          <p class="section-content">
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>

      <div class="section-search">
        <div class="right">
          <p class="section-badge">Search</p>
          <p class="section-title">
            구매를 원하는<br />
            상품을 검색하세요
          </p>
          <p class="section-content">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <img src="images/img_home_02.png" alt="상품 검색" />
      </div>

      <div class="section-register">
        <img src="images/img_home_03.png" alt="상품 등록" />
        <div>
          <p class="section-badge">Register</p>
          <p class="section-title">판매를 원하는<br />상품을 등록하세요</p>
          <p class="section-content">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <div class="bottom-banner">
      <div>
        <p class="banner-title">믿을 수 있는<br />판다마켓 중고 거래</p>
        <img
          src="images/img_home_banner_bottom.png"
          alt="판다마켓 캐릭터"
          class="image-bottom-banner"
        />
      </div>
    </div>

    <footer>
      <div>
        <p class="footer-company">@codeit - 2024</p>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <ul class="footer-sns">
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img src="images/icon_facebook.png" alt="페이스북 아이콘"
            /></a>
          </li>
          <li>
            <a href="https://x.com/" target="_blank">
              <img src="images/icon_twitter.png" alt="트위터 아이콘"
            /></a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="images/icon_youtube.png" alt="유튜브 아이콘"
            /></a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="images/icon_instagram.png" alt="인스타그램 아이콘"
            /></a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
